<sc-if value="{{ isOrgCalendar }}" hint-placeholder-val="{{ false }}">
  <div style="display:flex;flex-direction:column;gap:16px">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px">
      <sc-for list="{{ orgCalSummary }}" as="cs" hint-placeholder-count="4">
        <div style="background:rgba(255,255,255,.62);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);border:1px solid rgba(255,255,255,.75);border-radius:24px;box-shadow:0 15px 45px rgba(31,41,55,.10), inset 0 1px 0 rgba(255,255,255,.6);padding:16px 18px">
          <div style="display:flex;align-items:center;gap:8px"><span class="msr fill" style="font-size:18px;color:{{ cs.color }}">{{ cs.icon }}</span><span style="font-size:11.5px;color:#6B7280">{{ cs.label }}</span></div>
          <div style="font-size:22px;font-weight:600;color:#1F2937;margin-top:5px">{{ cs.value }}</div>
        </div>
      </sc-for>
    </div>

    <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center;background:rgba(255,255,255,.62);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);border:1px solid rgba(255,255,255,.75);border-radius:24px;box-shadow:0 15px 45px rgba(31,41,55,.10), inset 0 1px 0 rgba(255,255,255,.6);padding:14px 18px">
      <div style="font-size:11.5px;color:#9CA3AF">{{ orgCalFilterLabel }}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;flex:1">
        <sc-for list="{{ orgCalLegend }}" as="cl" hint-placeholder-count="7">
          <div onClick="{{ cl.onClick }}" style="{{ cl.style }}"><span style="width:9px;height:9px;border-radius:50%;background:{{ cl.color }};flex-shrink:0"></span>{{ cl.label }}</div>
        </sc-for>
      </div>
      <sc-if value="{{ hasOrgCalFilter }}" hint-placeholder-val="{{ false }}">
        <button onClick="{{ onClearOrgCalFilter }}" style-hover="background:rgba(31,41,55,.08)" style="display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:999px;border:1px solid rgba(31,41,55,.1);background:transparent;color:#6B7280;font-family:inherit;font-size:11.5px;cursor:pointer;transition:background 160ms ease"><span class="msr" style="font-size:15px">close</span>{{ orgCalClearLabel }}</button>
      </sc-if>
    </div>

    <div style="display:grid;grid-template-columns:1.6fr 1fr;gap:18px" class="nuv-chartrow">
      <div style="background:rgba(255,255,255,.62);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);border:1px solid rgba(255,255,255,.75);border-radius:24px;box-shadow:0 15px 45px rgba(31,41,55,.10), inset 0 1px 0 rgba(255,255,255,.6);padding:22px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
          <div style="display:flex;gap:7px;margin-right:auto">
            <sc-for list="{{ orgCalViewTabs }}" as="v" hint-placeholder-count="2">
              <button onClick="{{ v.onClick }}" style="{{ v.style }}"><span class="msr" style="font-size:16px">{{ v.icon }}</span>{{ v.label }}</button>
            </sc-for>
          </div>
          <button onClick="{{ onOrgCalPrev }}" title="{{ orgPrevMonthTitle }}" style-hover="background:rgba(255,255,255,.9);transform:translateY(-2px)" style="border:1px solid rgba(31,41,55,.1);background:rgba(255,255,255,.6);width:36px;height:36px;border-radius:12px;cursor:pointer;font-size:15px;transition:all 220ms ease">‹</button>
          <div style="font-weight:500;font-size:16px;color:#1F2937">{{ orgCalendarData.monthLabel }} {{ orgCalendarData.year }}</div>
          <button onClick="{{ onOrgCalNext }}" title="{{ orgNextMonthTitle }}" style-hover="background:rgba(255,255,255,.9);transform:translateY(-2px)" style="border:1px solid rgba(31,41,55,.1);background:rgba(255,255,255,.6);width:36px;height:36px;border-radius:12px;cursor:pointer;font-size:15px;transition:all 220ms ease">›</button>
        </div>
