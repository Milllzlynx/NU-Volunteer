<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics><style>
@media (max-width:900px){
  .nuv-login-split{grid-template-columns:1fr !important}
  .nuv-login-aside{display:none !important}
  .nuv-login-pane{padding:28px 22px !important}
}
@media (max-width:520px){
  .nuv-login-wrap{padding:14px !important}
  .nuv-login-pane{padding:24px 18px !important}
  .nuv-login-roles{grid-template-columns:1fr !important}
}
</style></helmet>

<div class="nuv-login-wrap" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:'Mitr','Noto Sans Thai','Inter',sans-serif">
  <div class="nuv-login-split" style="width:100%;max-width:940px;display:grid;grid-template-columns:1.05fr 1fr;border-radius:28px;overflow:hidden;background:rgba(255,255,255,.9);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border:1px solid rgba(255,255,255,.9);box-shadow:0 30px 70px rgba(31,41,55,.16)">

    <div class="nuv-login-aside nuv-keep" style="position:relative;min-height:520px;display:flex;flex-direction:column;justify-content:space-between;padding:38px 34px">
      <img src="https://images.unsplash.com/photo-1559027615-cd4628902d4a?auto=format&amp;fit=crop&amp;w=1000&amp;q=75" alt="" class="nuv-noinv" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block"/>
      <div style="position:absolute;inset:0;background:linear-gradient(160deg,rgba(233,113,113,.86) 0%,rgba(167,116,247,.88) 100%)"></div>

      <div style="position:relative;display:flex;align-items:center;gap:11px">
        <div style="width:40px;height:40px;border-radius:13px;flex-shrink:0;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" fill="none" style="width:23px;height:23px;display:block"><path d="M12 9.4c-1.25-2.6-5.2-2.3-5.2.95 0 2.3 3 4.3 5.2 5.75 2.2-1.45 5.2-3.45 5.2-5.75 0-3.25-3.95-3.55-5.2-.95Z" fill="#fff"/><path d="M3.4 15.2c0 4.2 3.95 6.5 8.6 6.5s8.6-2.3 8.6-6.5" stroke="#fff" stroke-width="2.1" stroke-linecap="round" opacity=".8"/></svg></div>
        <div style="font-weight:600;font-size:17px;color:#fff">NU Volunteer</div>
      </div>

      <div style="position:relative">
        <div style="font-size:30px;font-weight:600;color:#fff;line-height:1.35;text-shadow:0 2px 14px rgba(0,0,0,.22);text-wrap:pretty">{{ L.k7 }}<br/>{{ L.k5 }}</div>
        <div style="font-size:13.5px;line-height:1.85;color:rgba(255,255,255,.9);margin-top:12px;max-width:330px">{{ L.k1 }}</div>
        <div style="display:flex;flex-direction:column;gap:11px;margin-top:26px">
          <sc-for list="{{ perks }}" as="pk" hint-placeholder-count="3">
            <div style="display:flex;align-items:center;gap:10px">
              <div style="width:30px;height:30px;border-radius:10px;flex-shrink:0;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center"><span class="msr" style="font-size:17px;color:#fff">{{ pk.icon }}</span></div>
              <span style="font-size:13px;color:rgba(255,255,255,.94);line-height:1.6">{{ pk.label }}</span>
            </div>
          </sc-for>
        </div>
      </div>

      <div style="position:relative;display:flex;gap:22px">
        <sc-for list="{{ asideStats }}" as="s" hint-placeholder-count="2">
          <div>
            <div style="font-size:20px;font-weight:600;color:#fff;line-height:1.3">{{ s.value }}</div>
            <div style="font-size:11px;color:rgba(255,255,255,.78)">{{ s.label }}</div>
          </div>
        </sc-for>
      </div>
    </div>

    <div class="nuv-login-pane" style="padding:40px 38px;display:flex;flex-direction:column;justify-content:center">
      <div style="font-size:23px;font-weight:600;color:#1F2937;line-height:1.4">{{ L.k9 }}</div>
      <div style="font-size:13px;color:#6B7280;margin-top:3px;margin-bottom:24px">{{ L.k2 }}</div>

      <div style="display:flex;flex-direction:column;gap:14px">
        <div>
          <label style="font-size:12px;color:#6B7280;display:block;margin-bottom:6px">{{ L.k14 }}</label>
          <div style="position:relative">
            <span class="msr" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:19px;color:#9CA3AF;pointer-events:none">mail</span>
            <input value="{{ email }}" onChange="{{ onEmailChange }}" onKeyDown="{{ onKey }}" placeholder="student@nu.ac.th" style="width:100%;padding:13px 14px 13px 44px;border-radius:13px;border:1px solid rgba(31,41,55,.12);background:rgba(31,41,55,.03);font-family:inherit;font-size:14px;outline:none;color:#1F2937"/>
          </div>
        </div>

        <div>
          <label style="font-size:12px;color:#6B7280;display:block;margin-bottom:6px">{{ L.k13 }}</label>
          <div style="position:relative">
            <span class="msr" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:19px;color:#9CA3AF;pointer-events:none">lock</span>
            <input type="{{ pwType }}" value="{{ password }}" onChange="{{ onPasswordChange }}" onKeyDown="{{ onKey }}" placeholder="••••••••" style="width:100%;padding:13px 46px 13px 44px;border-radius:13px;border:1px solid rgba(31,41,55,.12);background:rgba(31,41,55,.03);font-family:inherit;font-size:14px;outline:none;color:#1F2937"/>
            <button onClick="{{ onTogglePw }}" title="{{ pwTitle }}" style-hover="background:rgba(31,41,55,.06)" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:9px;border:none;background:transparent;cursor:pointer;color:#9CA3AF;transition:all 200ms ease"><span class="msr" style="font-size:19px">{{ pwIcon }}</span></button>
          </div>
        </div>

        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
          <div onClick="{{ onToggleRemember }}" style="display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none">
            <div style="{{ rememberBox }}"><span class="msr" style="{{ rememberTick }}">check</span></div>
            <span style="font-size:12.5px;color:#4B5563">{{ L.k12 }}</span>
          </div>
          <a onClick="{{ onForgot }}" style="font-size:12.5px;cursor:pointer;color:#A774F7">{{ L.k8 }}</a>
        </div>

        <sc-if value="{{ hasError }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;align-items:center;gap:8px;padding:11px 14px;border-radius:12px;background:rgba(233,113,113,.1);border:1px solid rgba(233,113,113,.28)">
            <span class="msr fill" style="font-size:18px;color:#C2410C;flex-shrink:0">error</span>
            <span style="font-size:12.5px;color:#C2410C;line-height:1.6">{{ error }}</span>
          </div>
        </sc-if>

        <button onClick="{{ onSubmit }}" disabled="{{ loading }}" class="nuv-keep" style="{{ submitStyle }}">
          <sc-if value="{{ notLoading }}" hint-placeholder-val="{{ true }}">
            {{ L.k9 }}<span class="msr" style="font-size:19px">arrow_forward</span>
          </sc-if>
          <sc-if value="{{ loading }}" hint-placeholder-val="{{ false }}">
            <span style="width:17px;height:17px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:nuSpin 700ms linear infinite;display:inline-block"></span>{{ L.k4 }}
          </sc-if>
        </button>
      </div>


      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:24px;font-size:12.5px">
        <a onClick="{{ onBack }}" style="cursor:pointer;color:#9CA3AF;display:flex;align-items:center;gap:4px"><span class="msr" style="font-size:16px">arrow_back</span>{{ L.k10 }}</a>
        <div style="color:#6B7280">{{ L.k6 }} <a onClick="{{ onRegister }}" style="cursor:pointer;color:#A774F7;font-weight:500">{{ L.k11 }}</a></div>
      </div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
var LOG_LANG = "th";
const LOG_EN = {"ยินดีต้อนรับ":"Welcome","สู่ชุมชนจิตอาสา":"to the volunteer community","เข้าสู่ระบบเพื่อดูกิจกรรมที่เปิดรับ ติดตามชั่วโมงสะสม และรับใบประกาศของคุณ":"Sign in to browse open activities, track your hours, and collect your certificates.","เข้าสู่ระบบ":"Sign in","ใช้บัญชีอีเมลมหาวิทยาลัยของคุณ":"Use your university email account","อีเมล":"Email","รหัสผ่าน":"Password","จดจำฉันไว้":"Remember me","ลืมรหัสผ่าน?":"Forgot password?","กำลังเข้าสู่ระบบ...":"Signing in...","กลับหน้าแรก":"Back to home","ยังไม่มีบัญชี?":"No account yet?","สมัครสมาชิก":"Sign up","นิสิต":"Student","ผู้จัดกิจกรรม":"Organizer","ผู้ดูแลระบบ":"Administrator","ค้นหากิจกรรมจิตอาสาที่เปิดรับ":"Find open volunteer activities","ติดตามชั่วโมงสะสมแบบเรียลไทม์":"Track your hours in real time","รับใบประกาศอัตโนมัติเมื่อครบเกณฑ์":"Get certificates automatically when you qualify","นิสิตเข้าร่วม":"students joined","กิจกรรมต่อปี":"activities per year","ซ่อนรหัสผ่าน":"Hide password","แสดงรหัสผ่าน":"Show password"};
function T(s){ return LOG_LANG === "en" ? (LOG_EN[s] || s) : s; }
class Component extends DCLogic {
  state = { showPw:false, remember:true, loading:false };
  componentWillUnmount(){ clearTimeout(this._t); }
  submit = ()=>{
    if(this.props.loading) return;
    if(this.props.onSubmit) this.props.onSubmit();
  };
  i18nVals(){
    const en = this.props.lang === "en";
    return {L: {
      k1: en ? "Sign in to browse open activities, track your hours, and collect your certificates." : "เข้าสู่ระบบเพื่อดูกิจกรรมที่เปิดรับ ติดตามชั่วโมงสะสม และรับใบประกาศของคุณ",
      k2: en ? "Use your university email account" : "ใช้บัญชีอีเมลมหาวิทยาลัยของคุณ",
      k4: en ? "Signing in..." : "กำลังเข้าสู่ระบบ...",
      k5: en ? "to the volunteer community" : "สู่ชุมชนจิตอาสา",
      k6: en ? "No account yet?" : "ยังไม่มีบัญชี?",
      k7: en ? "Welcome" : "ยินดีต้อนรับ",
      k8: en ? "Forgot password?" : "ลืมรหัสผ่าน?",
      k9: en ? "Sign in" : "เข้าสู่ระบบ",
      k10: en ? "Back to home" : "กลับหน้าแรก",
      k11: en ? "Sign up" : "สมัครสมาชิก",
      k12: en ? "Remember me" : "จดจำฉันไว้",
      k13: en ? "Password" : "รหัสผ่าน",
      k14: en ? "Email" : "อีเมล",
    }};
  }
  renderVals(){
    LOG_LANG = this.props.lang === 'en' ? 'en' : 'th';
    const p = this.props;
    const rem = this.state.remember;
    return {
      ...this.i18nVals(),
      logoMark: p.logoMark || 'NU',
      email: p.email || '', password: p.password || '', error: p.error || '',
      hasError: !!p.error,
      perks: [
        {icon:'travel_explore', label:T('ค้นหากิจกรรมจิตอาสาที่เปิดรับ')},
        {icon:'schedule', label:T('ติดตามชั่วโมงสะสมแบบเรียลไทม์')},
        {icon:'workspace_premium', label:T('รับใบประกาศอัตโนมัติเมื่อครบเกณฑ์')},
      ],
      asideStats: [
        {value:'2,400+', label:T('นิสิตเข้าร่วม')},
        {value:'120+', label:T('กิจกรรมต่อปี')},
      ],
      pwType: this.state.showPw ? 'text' : 'password',
      pwIcon: this.state.showPw ? 'visibility_off' : 'visibility',
      pwTitle: this.state.showPw ? T('ซ่อนรหัสผ่าน') : T('แสดงรหัสผ่าน'),
      onTogglePw: ()=>this.setState(s=>({showPw:!s.showPw})),
      rememberBox: `width:19px;height:19px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all 200ms ease;border:1px solid ${rem?'transparent':'rgba(31,41,55,.22)'};background:${rem?'linear-gradient(135deg,#E97171,#A774F7)':'transparent'}`,
      rememberTick: `font-size:14px;color:#fff;opacity:${rem?1:0};transition:opacity 200ms ease`,
      onToggleRemember: ()=>this.setState(s=>({remember:!s.remember})),
      loading: !!p.loading || this.state.loading, notLoading: !(p.loading || this.state.loading),
      submitStyle: `margin-top:4px;display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,#E97171,#A774F7);color:#fff;border:none;padding:14px;border-radius:14px;font-family:inherit;font-weight:500;font-size:14.5px;box-shadow:0 8px 22px rgba(167,116,247,.34);transition:all 220ms ease;cursor:${this.state.loading?'wait':'pointer'};opacity:${this.state.loading?.72:1}`,
      onKey: (e)=>{ if(e.key==='Enter') this.submit(); },
      onEmailChange: (e)=> p.onEmail && p.onEmail(e.target.value),
      onPasswordChange: (e)=> p.onPassword && p.onPassword(e.target.value),
      onSubmit: this.submit,
      onForgot: ()=> p.onForgot && p.onForgot(),
      onRegister: ()=> p.onRegister && p.onRegister(),
      onBack: ()=> p.onBack && p.onBack(),
    };
  }
}

</script>
</body>
</html>
