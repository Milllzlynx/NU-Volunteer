# การตั้งค่า deploy บน Netlify
#
# ไฟล์นี้อยู่ราก repo เพราะ Netlify อ่าน netlify.toml จากรากเสมอ
# ส่วนตัวแอป Next.js อยู่ในโฟลเดอร์ย่อย จึงต้องบอก base ให้ชัด
# ไม่งั้น build จะไปรันที่รากซึ่งไม่มี package.json
#
# ฐานข้อมูลต้องเป็น Turso (libsql://) ไม่ใช่ไฟล์ SQLite บนดิสก์ — ฟังก์ชันบน Netlify
# ได้ดิสก์ใหม่ทุกครั้งที่ถูกเรียก ไฟล์ .db ที่เขียนไว้จะหายไปทันที
# ดูขั้นตอนเต็มที่ nu-volunteer/DEPLOYMENT.md หัวข้อ "Netlify + Turso"

[build]
  base = "nu-volunteer"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"
